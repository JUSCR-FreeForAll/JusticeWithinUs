name: Repository configuration validation

on:
  push:
    branches: [main, integration/ll-live-odin-foundation]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-config:
    name: Validate committed configuration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate configuration files
        run: node scripts/verify-config.mjs
